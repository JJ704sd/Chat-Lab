<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中技 · 智能运价管理</title>
<link rel="stylesheet" href="/assets/management.css">
<script src="/assets/management-prefill.js" defer></script>
<script src="/assets/pdf-reader.js" defer></script>
<script src="/assets/management.js" defer></script>
</head>
<body>
<div class="app">
 <nav class="rail" aria-label="主导航">
  <div class="brandmark" aria-label="中技">ZJ<span>中技</span></div>
  <button class="nav-item active" data-view="demo" title="双链路演示"><span data-icon="workflow"></span><span>演示</span></button>
  <button class="nav-item" data-view="pending" title="待审核价格"><span data-icon="checklist"></span><span>待审核</span><b id="pendingBadge">0</b></button>
  <button class="nav-item" data-view="library" title="已生效价格表"><span data-icon="table"></span><span>价格表</span></button>
  <div class="rail-spacer"></div>
  <button class="nav-item" data-action="info" title="演示说明"><span data-icon="info"></span><span>说明</span></button>
  <div class="rail-foot">AI & DIGITAL</div>
 </nav>
 <div class="shell">
  <header class="topbar"><div><h1>智能运价管理</h1><span class="top-sub">供应商报价协同工作台</span></div><div class="top-actions"><span class="tag neutral">本地演示库</span><span class="reviewer"><i>审</i>价格审核负责人</span><button class="text-button" data-action="new-run">新一轮演示</button></div></header>
  <main>
   <section class="headline"><div><div class="eyebrow">AIRFREIGHT PRICING</div><h2 id="pageTitle">两种报价来源，一张可信价格表</h2><p id="pageSubtitle">Agent 整理，人工确认，价格与依据一起留存。</p></div><div class="lane-switch" role="tablist" aria-label="报价来源"><button role="tab" data-lane="pdf"><span data-icon="file"></span>供应商提供价表</button><button role="tab" data-lane="chat"><span data-icon="chat"></span>群聊询价报价</button></div></section>
   <div id="stepper" class="stepper" aria-label="演示进度"></div>
   <div id="mobilePanels" class="mobile-tabs" aria-label="当前阶段内容"></div>
   <div id="workspace" class="workspace"></div>
  </main>
  <footer><div class="footer-context"><span class="status-icon" data-icon="shield"></span><div><strong id="footerTitle">人工确认后，价格才生效</strong><span id="footerHint">真实资料已就绪</span></div></div><div class="footer-actions"><button class="button" id="secondary">返回</button><button class="button primary" id="primary">模拟 09:00 索价</button></div></footer>
 </div>
</div>
<dialog id="dialog"><header><h3 id="dialogTitle"></h3><button class="icon-button" id="closeDialog" aria-label="关闭">×</button></header><div id="dialogBody"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden>
</body>
</html>
