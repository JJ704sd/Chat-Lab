[project]
name = "chatlog-assistant"
version = "0.1.0"
description = "Local-first logistics chat record analysis assistant"
requires-python = ">=3.11"
dependencies = [
  "sqlcipher3==0.6.2",
  "pdfplumber>=0.11,<0.12",
]

[project.scripts]
chatlog-assistant = "chatlog_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatlog_assistant"]
